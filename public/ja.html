        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            currentOriginalFileName = file.name.replace(/\.[^/.]+$/, '');
            fileNameDisplay.textContent = file.name;
            const reader = new FileReader();
            reader.readAsText(file, 'UTF-8');
            reader.onload = function(e) {

        function parseSubtitles(text, ext) {
            text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (ext === 'srt' || ext === 'vtt') return parseSRTorVTT(text);
            if (ext === 'ass' || ext === 'ssa') return parseASS(text);
            if (ext === 'lrc') return parseLRC(text);
            if (ext === 'sbv') return parseSBV(text);
            if (text.includes('-->')) return parseSRTorVTT(text);
            if (text.includes('[Script Info]')) return parseASS(text);
            if (/\[\d{2}:\d{2}\.\d{2,3}\]/.test(text)) return parseLRC(text);
            const lines = text.split('\n').filter(l => l.trim() !== '');
            return lines.map((line, idx) => ({
                start: idx * 2000, end: (idx + 1) * 2000, text: line.trim()
            }));
        }

        function timeToMs(timeStr) {
            let parts = timeStr.replace(',', '.').split(':');
            let hours = 0, minutes = 0, seconds = 0, ms = 0;
            if (parts.length === 3) {
                hours = parseInt(parts[0], 10);
                minutes = parseInt(parts[1], 10);
                let secParts = parts[2].split('.');
                seconds = parseInt(secParts[0], 10);
                ms = secParts[1] ? parseInt((secParts[1] + '000').substring(0, 3), 10) : 0;
            } else if (parts.length === 2) {
                minutes = parseInt(parts[0], 10);
                let secParts = parts[1].split('.');
                seconds = parseInt(secParts[0], 10);
                ms = secParts[1] ? parseInt((secParts[1] + '000').substring(0, 3), 10) : 0;
            }
            return (hours * 3600 + minutes * 60 + seconds) * 1000 + ms;
        }

        function parseSRTorVTT(text) {
            const blocks = text.split(/\n\s*\n/);
            const subs = [];
            const timeRegex = /((?:\d{1,2}:)?\d{2}:\d{2}[.,]\d{2,3})\s*-->\s*((?:\d{1,2}:)?\d{2}:\d{2}[.,]\d{2,3})/;
            for (let block of blocks) {
                const lines = block.split('\n');
                let timeLineIdx = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (timeRegex.test(lines[i])) { timeLineIdx = i; break; }
                }
                if (timeLineIdx !== -1) {
                    const match = lines[timeLineIdx].match(timeRegex);
                    const start = timeToMs(match[1]);
                    const end = timeToMs(match[2]);
                    const subText = lines.slice(timeLineIdx + 1).join('\n').replace(/<[^>]+>/g, '').trim();
                    if (subText) subs.push({ start, end, text: subText });
                }
            }
            return subs;
        }

        function parseASS(text) {
            const lines = text.split('\n');
            const subs = [];
            let formatCols = [];
            for (let line of lines) {
                if (line.startsWith('Format:')) {
                    formatCols = line.substring(7).trim().split(',').map(s => s.trim().toLowerCase());
                } else if (line.startsWith('Dialogue:')) {
                    const data = line.substring(9).trim().split(',');
                    const limit = formatCols.length - 1;
                    const mainData = data.slice(0, limit);
                    const textData = data.slice(limit).join(',');
                    const startIdx = formatCols.indexOf('start');
                    const endIdx = formatCols.indexOf('end');
                    const textIdx = formatCols.indexOf('text');
                    if (startIdx !== -1 && endIdx !== -1) {
                        let subText = textIdx === formatCols.length - 1 ? textData : mainData[textIdx];
                        subText = subText.replace(/\{[^}]+\}/g, '').replace(/\\N/gi, '\n');
                        subs.push({ start: timeToMs(mainData[startIdx]), end: timeToMs(mainData[endIdx]), text: subText.trim() });
                    }
                }
            }
            return subs.sort((a, b) => a.start - b.start);
        }

        function parseLRC(text) {
            const lines = text.split('\n');
            const subs = [];
            const timeRegex = /\[(\d{2}:\d{2}\.\d{2,3})\](.*)/;
            for (let line of lines) {
                const match = line.match(timeRegex);
                if (match) {
                    const start = timeToMs(match[1]);
                    const subText = match[2].trim();
                    if (subText) subs.push({ start, end: start + 3000, text: subText });
                }
            }
            for (let i = 0; i < subs.length - 1; i++) subs[i].end = subs[i+1].start;
            return subs;
        }

        function parseSBV(text) {
            const blocks = text.split(/\n\s*\n/);
            const subs = [];
            for (let block of blocks) {
                const lines = block.split('\n');
                if (lines.length >= 2 && lines[0].includes(',')) {
                    const times = lines[0].split(',');
                    if (times.length === 2) {
                        const start = timeToMs(times[0]);
                        const end = timeToMs(times[1]);
                        const subText = lines.slice(1).join('\n').trim();
                        if (subText) subs.push({ start, end, text: subText });
                    }
                }
            }
            return subs;
        }

        function formatTime(ms, formatStr) {
            const date = new Date(ms);
            const h = Math.floor(ms / 3600000);
            const m = date.getUTCMinutes();
            const s = date.getUTCSeconds();
            const millis = date.getUTCMilliseconds();
            const pad2 = num => num.toString().padStart(2, '0');
            const pad3 = num => num.toString().padStart(3, '0');
            if (formatStr === 'srt') return `${pad2(h)}:${pad2(m)}:${pad2(s)},${pad3(millis)}`;
            if (formatStr === 'vtt') return `${pad2(h)}:${pad2(m)}:${pad2(s)}.${pad3(millis)}`;
            if (formatStr === 'ass') return `${h}:${pad2(m)}:${pad2(s)}.${pad2(Math.floor(millis/10))}`;
            if (formatStr === 'lrc') return `${pad2(h*60 + m)}:${pad2(s)}.${pad2(Math.floor(millis/10))}`;
            if (formatStr === 'sbv') return `${h}:${pad2(m)}:${pad2(s)}.${pad3(millis)}`;
            return '';
        }

        function renderOutput() {
            const format = targetFormatSelect.value;
            let outputText = '';
            switch (format) {
                case 'txt':
                    outputText = currentSubtitles.map(s => s.text).join('\n');
                    downloadText.textContent = i18n.download_txt;
                    break;
                case 'srt':
                    outputText = currentSubtitles.map((s, i) => `${i + 1}\n${formatTime(s.start, 'srt')} --> ${formatTime(s.end, 'srt')}\n${s.text}`).join('\n\n');
                    downloadText.textContent = i18n.download_srt;
                    break;
                case 'vtt':
                    outputText = 'WEBVTT\n\n' + currentSubtitles.map(s => `${formatTime(s.start, 'vtt')} --> ${formatTime(s.end, 'vtt')}\n${s.text}`).join('\n\n');
                    downloadText.textContent = i18n.download_vtt;
                    break;
                case 'ass':
                    outputText = `[Script Info]\nTitle: Converted Subtitles\nScriptType: v4.00+\nWrapStyle: 0\nScaledBorderAndShadow: yes\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Default,Arial,20,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,2,2,10,10,10,1\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n`;
                    outputText += currentSubtitles.map(s => `Dialogue: 0,${formatTime(s.start, 'ass')},${formatTime(s.end, 'ass')},Default,,0,0,0,,${s.text.replace(/\n/g, '\\N')}`).join('\n');
                    downloadText.textContent = i18n.download_ass;
                    break;
                case 'lrc':
                    outputText = currentSubtitles.map(s => `[${formatTime(s.start, 'lrc')}]${s.text.replace(/\n/g, ' ')}`).join('\n');
                    downloadText.textContent = i18n.download_lrc;
                    break;
                case 'sbv':
                    outputText = currentSubtitles.map(s => `${formatTime(s.start, 'sbv')},${formatTime(s.end, 'sbv')}\n${s.text}`).join('\n\n');
                    downloadText.textContent = i18n.download_sbv;
                    break;
            }
            textPreview.value = outputText;
        }

        copyBtn.addEventListener('click', () => {
            textPreview.select();
            try {
                document.execCommand('copy');
                showToast('toast_copied');
            } catch (err) {
                showToast('toast_copy_fail');
            }
            window.getSelection().removeAllRanges();
        });

        downloadBtn.addEventListener('click', () => {
            const format = targetFormatSelect.value;
            const blob = new Blob([textPreview.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `${currentOriginalFileName}_converted.${format}`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>

</body>
